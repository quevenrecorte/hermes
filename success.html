<!DOCTYPE html>
<html lang="en" data-theme="routine">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes | Message Sent Successfully</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      overflow: hidden;
    }
    
    .success-card {
      text-align: center;
      padding: 40px 24px;
      max-width: 440px;
      height: auto;
      max-height: 480px;
      margin: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-radius: 16px;
    }
    
    .success-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      background: rgba(34, 197, 94, 0.1);
      border: 1.5px solid rgba(34, 197, 94, 0.35);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      color: #22c55e;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.15);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .success-title {
      font-size: 26px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      background: none;
      -webkit-text-fill-color: initial;
    }
    
    .success-desc {
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
      font-size: 14px;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Animated Background Elements -->
  <div class="bg-elements">
    <div class="glow-orb orb-1" style="background: #22c55e;"></div>
    <div class="glow-orb orb-2" style="background: #15803d;"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <div class="glass-panel success-card">

      <div class="success-icon">
        <i class="ph-fill ph-check-circle"></i>
      </div>

      <h1 class="success-title">MESSAGE SENT</h1>
      
      <p class="subtitle" style="margin-bottom:18px; color:#22c55e; letter-spacing: 1px;">
        SUCCESSFULLY DELIVERED
      </p>

      <p class="success-desc">
        Your message has been successfully sent. The recipient has been notified.
      </p>

      <a href="index.html" class="back-btn">
        <i class="ph ph-arrow-left"></i> BACK TO MESSENGER
      </a>

    </div>
  </div>

</body>
</html>
