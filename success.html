<!DOCTYPE html>
<html lang="en" data-theme="routine">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hermes | Transmission Success</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    .success-card {
      text-align: center;
      padding: 48px 32px;
    }
    
    .success-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      background: rgba(34, 197, 94, 0.1);
      border: 2px solid rgba(34, 197, 94, 0.4);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      color: #22c55e;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.2);
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .success-title {
      font-size: 32px;
      font-weight: 700;
      color: #22c55e;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    
    .success-desc {
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.6;
    }
    
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.3s ease;
    }
    
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Animated Background Elements -->
  <div class="bg-elements">
    <div class="glow-orb orb-1" style="background: #22c55e;"></div>
    <div class="glow-orb orb-2" style="background: #15803d;"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="container">
    <div class="glass-panel main-card success-card">

      <div class="success-icon">
        <i class="ph-fill ph-check-circle"></i>
      </div>

      <h1 class="success-title">TRANSMISSION SUCCESS</h1>
      
      <p class="subtitle" style="margin-bottom:24px; color:#22c55e;">
        PAYLOAD DELIVERED
      </p>

      <p class="success-desc">
        Your secure message has been successfully routed through the Hermes network. The recipient has been notified.
      </p>

      <a href="index.html" class="back-btn">
        <i class="ph ph-arrow-left"></i> RETURN TO TERMINAL
      </a>

    </div>
  </div>

</body>
</html>
